# ==============================================================================
# /etc/ps5-m2-protection.conf - Configurazione Protezione NVMe M.2 PS5
# ==============================================================================
# Modulo di protezione hardware/controller basato su NVMe Namespace Write Protection
# (Feature ID 0x84, stato 1 = Write Protect Reversibile).
# ==============================================================================

# Abilitazione generale del modulo (1 = attivo, 0 = disabilitato)
M2_PROTECTION_ENABLED=1

# Identità univoca del disco M.2 registrata (Identify Controller & Namespace)
# Il modulo opera ESCLUSIVAMENTE se il disco corrisponde esattamente a questi valori
M2_CTRL_MODEL=""
M2_CTRL_SERIAL=""
M2_NS_ID=1
M2_NS_NGUID=""
M2_NS_EUI64=""
M2_NS_SIZE_SECTORS=0

# Riattivazione automatica della protezione durante la fase finale di shutdown
# (1 = riattiva automaticamente prima di spegnimento/riavvio, 0 = solo manuale)
AUTO_PROTECT_ON_SHUTDOWN=1

# Livello diagnostica (1 = verboso su /dev/kmsg e console, 0 = sintetico)
VERBOSE_LOGGING=1
